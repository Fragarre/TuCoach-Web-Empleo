name: GVA connectivity diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gva-connectivity:
    runs-on: ubuntu-latest
    steps:
      - name: Test official GVA endpoints
        shell: bash
        run: |
          set -u
          echo "=== sede.gva.es detail ==="
          curl -4 -sS -o /tmp/gva-detail.html -D /tmp/gva-detail.headers \
            --connect-timeout 15 --max-time 30 \
            "https://sede.gva.es/detall-ocupacio-publica?id_emp=114380"
          rc=$?
          echo "curl_exit=$rc"
          if [ "$rc" -eq 0 ]; then
            head -n 1 /tmp/gva-detail.headers || true
            wc -c /tmp/gva-detail.html
          fi

          echo "=== sede.gva.es PDF ==="
          curl -4 -sS -o /tmp/gva.pdf -D /tmp/gva-pdf.headers \
            --connect-timeout 15 --max-time 30 \
            "https://sede.gva.es/descarregues/2026/10/160201-CONVOCATORIA_ADC_EDU_PAS_1.2026_C1_firmado.pdf"
          rc=$?
          echo "curl_exit=$rc"
          if [ "$rc" -eq 0 ]; then
            head -n 1 /tmp/gva-pdf.headers || true
            wc -c /tmp/gva.pdf
            file /tmp/gva.pdf
          fi
